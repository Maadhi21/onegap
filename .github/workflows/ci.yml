name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      - name: frozen test set unchanged
        # The public snapshot ships SHA256SUMS but not test.jsonl (test prompts are not in the public repo), so
        # the hash check runs only where the frozen file itself is present (the private repo).
        run: if [ -f data/frozen/SHA256SUMS ] && [ -f data/frozen/test.jsonl ]; then uv run onegap verify-frozen; else echo "frozen test file not in this checkout; hashes listed in data/frozen/SHA256SUMS"; fi
