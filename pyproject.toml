[project]
name = "onegap"
version = "0.1.0"
description = "One Gap, Two Repairs: multilingual multi-turn safety audit and circuit-restricted repair for Tiny Aya Global"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Light local deps only. Model/toolkit deps live in requirements-{core,circuit,audit}.txt
# and are installed inside HF Jobs, never on the Windows dev box.
local = [
    "datasets>=2.19",
    "huggingface_hub>=0.30",
    "cohere>=5",
    "matplotlib>=3.8",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
onegap = "onegap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onegap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long docstrings in stubs; formatter handles code width
